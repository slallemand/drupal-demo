{{- if not .Values.existingSecret }}
{{- $name := include "mariadb.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := .Values.auth.password }}
{{- if and (not $password) $existing }}
{{- $password = index $existing.data "database-password" | b64dec }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 16 }}
{{- end }}
{{- $rootPassword := .Values.auth.rootPassword }}
{{- if and (not $rootPassword) $existing }}
{{- $rootPassword = index $existing.data "database-root-password" | b64dec }}
{{- end }}
{{- if not $rootPassword }}
{{- $rootPassword = randAlphaNum 16 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mariadb.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-name: {{ .Values.auth.database | quote }}
  database-user: {{ .Values.auth.username | quote }}
  database-password: {{ $password | quote }}
  database-root-password: {{ $rootPassword | quote }}
{{- end }}
