{{- $name := printf "%s-settings" (include "drupal.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $salt := .Values.hashSalt }}
{{- if and (not $salt) $existing }}
{{- $salt = index $existing.data "hash-salt" | b64dec }}
{{- end }}
{{- if not $salt }}
{{- $salt = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "drupal.labels" . | nindent 4 }}
type: Opaque
stringData:
  hash-salt: {{ $salt | quote }}
